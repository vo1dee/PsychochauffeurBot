# Production stack for the OCI host. Deployed by .github/workflows/deploy.yml.
# Secrets live only in the untracked .env next to this file.
name: psychochauffeur

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-telegram_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # Only reachable from the host itself (for restore scripts / psql), never publicly.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-telegram_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    image: ghcr.io/vo1dee/psychochauffeurbot:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      # Only present when the local-bot-api profile is enabled (see below).
      telegram-bot-api:
        condition: service_started
        required: false
    # Config web UI (config_v2/web.py). Requires CONFIG_WEB_PASSWORD in .env for non-localhost access.
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./config/global:/app/config/global
      - ./config/private:/app/config/private
      - ./config/group:/app/config/group
      - ./config/backups:/app/config/backups
      - ./config/archive:/app/config/archive
      - ./cookies.txt:/app/cookies.txt
      # Files the local Bot API server fetched for getFile; read-only, same path as in that container.
      - bot_api_data:/var/lib/telegram-bot-api:ro
    # The server writes those files as 0640 / dirs 0750 owned by its group (gid 101 in
    # aiogram/telegram-bot-api); joining that group lets the bot read them.
    group_add:
      - "101"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Local Telegram Bot API server (docs/LOCAL_BOT_API.md). Opt-in: add
  # COMPOSE_PROFILES=local-bot-api plus TELEGRAM_API_ID/TELEGRAM_API_HASH to .env,
  # then point the bot at it with TELEGRAM_API_BASE_URL. Lifts the upload limit to 2000 MB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    profiles: ["local-bot-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    # No published port: the bot reaches it as http://telegram-bot-api:8081 on the compose network.
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api
      # Uploads are sent as file:// paths, so the server must see every directory the bot
      # sends from at the same path: downloads/ (videos, photos) and data/music/ (/song audio).
      - ./downloads:/app/downloads:ro
      - ./data/music:/app/data/music:ro
    mem_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mandatory cleanup of downloaded media. Large files go fast; everything goes eventually.
  # Bot API: only files inside per-bot subfolders (depth >= 3), never its binlog/db at depth 2.
  media-cleanup:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - |
        while true; do
          find /app/downloads -type f -size +50M -mmin +30 -delete
          find /app/downloads -type f -mmin +360 -delete
          find /var/lib/telegram-bot-api -mindepth 3 -type f -size +50M -mmin +30 -delete
          find /var/lib/telegram-bot-api -mindepth 3 -type f -mmin +120 -delete
          sleep 600
        done
    volumes:
      - ./downloads:/app/downloads
      - bot_api_data:/var/lib/telegram-bot-api
    mem_limit: 32m
    restart: unless-stopped

volumes:
  postgres_data:
  bot_api_data:
